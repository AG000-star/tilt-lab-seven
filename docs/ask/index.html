<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>实验问答 · 倾角实验室</title><style>
:root{color-scheme:dark;--gold:#ffc043;--line:#594525;--muted:#c3b58f}*{box-sizing:border-box}body{margin:0;background:#0c0b08;color:#eee3c9;font:16px/1.65 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:26px 20px 48px}header,form,.prompts{display:flex;gap:10px;align-items:center}header{justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:15px;color:var(--gold);font:15px Consolas,monospace}a{color:var(--muted)}h1{font-size:clamp(28px,5vw,42px);margin:30px 0 5px}p{margin:0 0 16px}.summary{border-left:2px solid var(--gold);padding:8px 14px;margin:20px 0;background:#211d14}.prompts{flex-wrap:wrap}button,input{font:inherit}button{padding:8px 13px;background:#1e1a13;border:1px solid var(--line);color:var(--gold);cursor:pointer;border-radius:3px}button:hover{border-color:var(--gold)}button:disabled{opacity:.55;cursor:wait}#thread{margin:18px 0}.turn{border-top:1px solid var(--line);padding:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}.turn b{display:block;color:var(--gold);font-size:14px}input{min-width:0;flex:1;background:#15130f;border:1px solid var(--line);color:#fff;padding:10px}form button{background:var(--gold);color:#281b0b}#status{color:var(--muted);margin:10px 0;font-size:14px}
</style></head><body><main><header><span>第七小组 / TILT LAB</span><a href="../">重播片头</a></header><h1>倾角实验问答</h1><p>围绕 20 名大学生、8 档倾角的短时打字实验提问。</p>
<div class="summary">20° 档的平均 RULA 总分为 3.40，整体舒适度为 5.05 / 7。在本组实验中，这两项表现最好。</div>
<div class="prompts"><button type="button">为什么先试 20°？</button><button type="button">20° 和 30° 怎么选？</button><button type="button">速度更快的结论有多可靠？</button></div>
<section id="thread" aria-label="问答记录" aria-live="polite"></section><form><input aria-label="实验问题" placeholder="输入问题，也可以继续追问" required maxlength="600"><button>发送</button></form><p id="status" role="status"></p></main>
<script>
const thread=document.querySelector('#thread'),statusLine=document.querySelector('#status'),form=document.querySelector('form'),input=form.querySelector('input');
const messages=[];
let active=null;
const quickAnswers=new Map([
 ['为什么先试 20°？','用自带键盘打字时，可以从 20° 开始。20 名参与者在这一档的平均舒适度为 5.05/7，姿势评分为 3.40，两项在八档中表现最好。与 10°、30° 的差异未达到校正后的显著标准，试打时可以按自己的感受选档。'],
 ['20° 和 30° 怎么选？','想兼顾整体舒适和姿势，可以先试 20°。如果更在意颈部，可以用同一段文字比较 30°。从 20° 到 30°，颈部疲劳均值从 2.65 降到 2.40，腕部疲劳从 2.15 升到 3.15。留意颈部轻松的同时，手腕会不会更累。'],
 ['速度更快的结论有多可靠？','20° 的平均速度为每分钟 57.70 字。两种总体检验给出了不同结果：重复测量方差分析经校正后 p = .073，Friedman 检验 p = .001。现有结果不足以确定 20° 比某个相邻档打字更快。']
]);
function turn(who,content){
 const entry=document.createElement('div'),label=document.createElement('b'),body=document.createElement('span');
 entry.className='turn';label.textContent=who;body.textContent=content;entry.append(label,body);thread.append(entry);return {label,body};
}
function remember(question,answer){messages.push({role:'user',content:question},{role:'assistant',content:answer});if(messages.length>8)messages.splice(0,2)}
function cancelPending(){
 if(!active)return;
 active.controller.abort();
 active.view.label.textContent='已停止生成';
 if(!active.view.body.textContent)active.view.body.textContent='这个问题的生成已停止。';
 active=null;
}
async function ask(question){
 const draft=question.trim();if(!draft)return;
 cancelPending();input.value='';turn('你',draft);
 const quick=quickAnswers.get(draft);
 if(quick){turn('实验数据',quick);remember(draft,quick);statusLine.textContent='可以继续追问。';return}
 const controller=new AbortController(),view=turn('正在连接智谱…','');
 active={controller,view};statusLine.textContent='你可以继续输入，发送新问题会停止上一条生成。';
 const timer=setTimeout(()=>controller.abort(),20000);
 try{
  const res=await fetch('https://tilt-lab-seven-ergonomics.usefulcrown8.chatgpt.site/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Accept:'text/event-stream'},body:JSON.stringify({messages:[...messages,{role:'user',content:draft}]}),signal:controller.signal});
  if(!res.ok)throw Error((await res.json()).error||'模型暂时不可用。');
  const reader=res.body.getReader(),decoder=new TextDecoder();
  let buffer='',complete=false,answer='';
  function readLine(line){
   if(!line.startsWith('data:'))return;
   const data=line.slice(5).trim();if(!data)return;
   if(data==='[DONE]'){complete=true;return}
   const event=JSON.parse(data);if(event.error)throw Error('模型响应中断。');
   const choice=event.choices?.[0],piece=choice?.delta?.content;
   if(piece){answer+=piece;view.label.textContent='智谱 '+res.headers.get('X-Advice-Model');view.body.textContent=answer}
   if(choice?.finish_reason==='stop')complete=true;
  }
  while(!complete){
   const {value,done}=await reader.read();if(active?.controller!==controller)return;
   buffer+=done?decoder.decode():decoder.decode(value,{stream:true});
   const lines=buffer.split('\n');buffer=lines.pop();
   for(const line of lines)readLine(line);
   if(done){if(buffer)readLine(buffer);break}
  }
  await reader.cancel().catch(()=>{});
  if(active?.controller!==controller)return;
  if(!complete||!answer.trim())throw Error('模型回复未完成。');
  remember(draft,answer);statusLine.textContent='可以继续追问。';
 }catch(error){
  if(active?.controller!==controller)return;
  view.label.textContent=view.body.textContent?'智谱 · 回复未完成':'云端暂未回答';
  if(!view.body.textContent)view.body.textContent=controller.signal.aborted?'本次请求超时。':error.message;
  const retry=document.createElement('button');retry.type='button';retry.textContent='重新提问';retry.onclick=()=>ask(draft);
  view.body.after(document.createElement('br'),retry);statusLine.textContent='也可以点击上方的常见问题，直接查看实验答案。';
 }finally{clearTimeout(timer);if(active?.controller===controller)active=null}
}
form.addEventListener('submit',event=>{event.preventDefault();ask(input.value)});
document.querySelectorAll('.prompts button').forEach(b=>b.onclick=()=>ask(b.textContent));
</script></body></html>
